name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Run reproducible quality checks
        run: nix flake check --no-update-lock-file --keep-going -L

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Validate fixed dependency hash and tidy manifests offline
        run: nix build .#checks.x86_64-linux.dependencies --no-update-lock-file --option sandbox true -L
      - name: Reject versioned vendor content and changed manifests
        run: |
          test -z "$(git ls-files vendor)"
          git diff --exit-code -- go.mod go.sum flake.lock
      - name: Show dependency manifest status
        if: ${{ always() }}
        run: git status --porcelain=v1 --untracked-files=all -- go.mod go.sum flake.nix flake.lock

  release-builds:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Compile release output
        env:
          TARGET: ${{ matrix.target }}
        run: nix build ".#packages.x86_64-linux.$TARGET" --no-update-lock-file -L

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Scan current repository tree with redaction
        run: nix develop --command gitleaks dir --redact --config .gitleaks.toml .
      - name: Scan available history with redaction
        run: nix develop --command gitleaks git --redact --config .gitleaks.toml --log-opts=--all .

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, dependencies, release-builds, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out aggregate evaluator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require every validation category
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.release-builds.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          SECRET_RESULT: ${{ needs.secrets.result }}
        run: |
          bash scripts/ci-gate.sh \
            "format=$QUALITY_RESULT" \
            "test=$QUALITY_RESULT" \
            "race=$QUALITY_RESULT" \
            "vet=$QUALITY_RESULT" \
            "static=$QUALITY_RESULT" \
            "vulnerability=$QUALITY_RESULT" \
            "build=$BUILD_RESULT" \
            "dependencies=$DEPENDENCIES_RESULT" \
            "secret=$SECRET_RESULT"
