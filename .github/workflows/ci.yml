name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
      - name: Run reproducible quality checks
        run: nix flake check --no-update-lock-file --keep-going -L

  vendor:
    name: vendor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
      - name: Regenerate module and vendor files
        run: nix develop --command bash scripts/check-vendor.sh
      - name: Confirm untracked vendor files are visible
        if: ${{ always() }}
        run: git status --porcelain=v1 --untracked-files=all -- go.mod go.sum vendor

  release-builds:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
      - name: Compile release output
        env:
          TARGET: ${{ matrix.target }}
        run: nix build ".#packages.x86_64-linux.$TARGET" --no-update-lock-file -L

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
      - name: Scan current repository tree with redaction
        run: nix develop --command gitleaks dir --redact --config .gitleaks.toml .
      - name: Scan available history with redaction
        run: nix develop --command gitleaks git --redact --config .gitleaks.toml --log-opts=--all .

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, vendor, release-builds, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out aggregate evaluator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require every validation category
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.release-builds.result }}
          VENDOR_RESULT: ${{ needs.vendor.result }}
          SECRET_RESULT: ${{ needs.secrets.result }}
        run: |
          bash scripts/ci-gate.sh \
            "format=$QUALITY_RESULT" \
            "test=$QUALITY_RESULT" \
            "race=$QUALITY_RESULT" \
            "vet=$QUALITY_RESULT" \
            "static=$QUALITY_RESULT" \
            "vulnerability=$QUALITY_RESULT" \
            "build=$BUILD_RESULT" \
            "vendor=$VENDOR_RESULT" \
            "secret=$SECRET_RESULT"
