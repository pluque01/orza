name: Dependencies

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-weekly
  cancel-in-progress: false

jobs:
  scheduled-renovate:
    name: scheduled dependency proposals
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
      - name: Acquire UTC week marker and run Renovate
        env:
          LOG_LEVEL: info
          RENOVATE_ALLOWED_COMMANDS: '["^nix flake lock --update-input vulndb$"]'
          RENOVATE_REPOSITORY: ${{ github.repository }}
          RENOVATE_REVISION: ${{ github.sha }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: bash scripts/run-renovate-cycle.sh

  manual-dry-run:
    name: manual dependency discovery (full dry-run)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
      - name: Discover updates locally without a token
        env:
          LOG_LEVEL: info
        run: nix develop --command renovate --platform=local --dry-run=full --require-config=required
